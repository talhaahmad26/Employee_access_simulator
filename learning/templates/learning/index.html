<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Access Simulator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    textarea { width: 100%; height: 140px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .granted { background:#e6ffed; color:#0b7a3f; font-weight:600;}
    .denied { background:#ffecec; color:#b30000; font-weight:600;}
    .controls { margin-bottom: 12px; }
    .btn { padding: 8px 12px; cursor:pointer; border:1px solid #ccc; background:#fff; margin-right:6px; }
  </style>
</head>
<body>
  <h2>Employee Access Simulator</h2>
  <p>Paste JSON of employee requests or upload file (format shown below).</p>

  <div class="controls">
    <input type="file" id="fileInput">
    <button id="loadSample" class="btn">Load sample data</button>
    <button id="simulateBtn" class="btn">Simulate Access</button>
  </div>

  <textarea id="jsonInput" placeholder='[{"id":"EMP001","access_level":2,"request_time":"09:15","room":"ServerRoom"}, ...]'></textarea>

  <div id="status"></div>

  <div id="results"></div>

<script>
    /* ---------- CSRF TOKEN SETUP (Required for Django) ---------- */
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      // Check cookie name
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
const csrftoken = getCookie('csrftoken');
/* ----------------------------------------------------------- */
document.getElementById('fileInput').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    document.getElementById('jsonInput').value = evt.target.result;
  };
  reader.readAsText(f);
});
document.getElementById('loadSample').addEventListener('click', function(){
  const sample = [
    {"id":"EMP001","access_level":2,"request_time":"09:15","room":"ServerRoom"},
    {"id":"EMP002","access_level":1,"request_time":"09:30","room":"Vault"},
    {"id":"EMP003","access_level":3,"request_time":"10:05","room":"Vault"},
    {"id":"EMP004","access_level":3,"request_time":"09:45","room":"Vault"},
    {"id":"EMP005","access_level":2,"request_time":"08:50","room":"R&D Lab"},
    {"id":"EMP006","access_level":1,"request_time":"10:10","room":"R&D Lab"},
    {"id":"EMP007","access_level":2,"request_time":"10:18","room":"ServerRoom"},
    {"id":"EMP008","access_level":3,"request_time":"09:55","room":"Vault"},
    {"id":"EMP001","access_level":2,"request_time":"09:28","room":"ServerRoom"},
    {"id":"EMP006","access_level":1,"request_time":"10:15","room":"R&D Lab"}
  ];
  document.getElementById('jsonInput').value = JSON.stringify(sample, null, 2);
});

document.getElementById('simulateBtn').addEventListener('click', async function(){
  const text = document.getElementById('jsonInput').value;
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    document.getElementById('status').innerText = "Invalid JSON: " + e;
    return;
  }
  document.getElementById('status').innerText = "Simulating...";
  const resp = await fetch('/api/check_bulk/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': csrftoken     // ✅ Include CSRF token here
    },
    body: JSON.stringify({data: parsed})
  });
  const j = await resp.json();
  if (!resp.ok) {
    document.getElementById('status').innerText = "Error: " + JSON.stringify(j);
    return;
  }
  document.getElementById('status').innerText = "Done.";
  renderResults(j.results);
});

function renderResults(results) {
  if (!results || !results.length) {
    document.getElementById('results').innerHTML = "<p>No results</p>";
    return;
  }
  let html = '<table><thead><tr><th>id</th><th>access_level</th><th>request_time</th><th>room</th><th>status</th><th>reason</th></tr></thead><tbody>';
  results.forEach(r => {
    const cls = r.status === "Granted" ? 'granted' : 'denied';
    html += `<tr>
      <td>${r.id}</td>
      <td>${r.access_level}</td>
      <td>${r.request_time}</td>
      <td>${r.room}</td>
      <td class="${cls}">${r.status}</td>
      <td>${r.reason}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('results').innerHTML = html;
}
</script>
</body>
</html>
